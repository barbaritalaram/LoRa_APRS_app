name: Flutter CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.0' # Use a specific version for consistency
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./src
        run: flutter pub get

      - name: Analyze code
        working-directory: ./src
        run: flutter analyze

      - name: Run tests
        working-directory: ./src
        run: flutter test

      - name: Build APK
        working-directory: ./src
        run: flutter build apk --debug 